<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc"><title id="title">Active Directory security monitoring lab architecture</title><desc id="desc">A Windows 11 physical host contains Kali Linux and Windows Server virtual machines and an Ubuntu LTS WSL environment hosting Wazuh. Security events flow from Windows Server through the Wazuh agent to Wazuh for analysis, indexing, alerting, and dashboard review.</desc><defs><marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l9 5-9 5" fill="none" stroke="#1483b5" stroke-width="2"/></marker><marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l9 5-9 5" fill="none" stroke="#d55d67" stroke-width="2"/></marker><marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l9 5-9 5" fill="none" stroke="#159ca7" stroke-width="2"/></marker><style>.bg{fill:#f6fafe}.host{fill:#fff;stroke:#81a8c2;stroke-width:3}.box{fill:#fff;stroke:#c4d7e5;stroke-width:2}.vm{fill:#f1f7fb;stroke:#5a9cbe;stroke-width:2}.wsl{fill:#eef9fb;stroke:#66b4bc;stroke-width:2}.svc{fill:#fff;stroke:#8bb7ca;stroke-width:2}.title{font:700 32px Arial,sans-serif;fill:#132b43}.subtitle{font:16px Arial,sans-serif;fill:#5a7187}.h{font:700 19px Arial,sans-serif;fill:#163551}.t{font:15px Arial,sans-serif;fill:#425d74}.small{font:13px Arial,sans-serif;fill:#547087}.hostlabel{font:700 21px Arial,sans-serif;fill:#12496a}.arrowLabel{font:600 13px Arial,sans-serif;fill:#4a6278}.lineBlue{fill:none;stroke:#1483b5;stroke-width:3;marker-end:url(#arrowBlue)}.lineRed{fill:none;stroke:#d55d67;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#arrowRed)}.lineCyan{fill:none;stroke:#159ca7;stroke-width:3;marker-end:url(#arrowCyan)}.pill{fill:#e7f4fb;stroke:#c5deed}.pillText{font:600 12px Arial,sans-serif;fill:#21698e}</style></defs><rect class="bg" width="1600" height="980"/><text class="title" x="58" y="62">Active Directory Security Monitoring Lab</text><text class="subtitle" x="58" y="92">Windows security events move from the domain controller to Wazuh for analysis and alert review.</text><rect class="host" x="48" y="125" width="1504" height="780" rx="22"/><text class="hostlabel" x="82" y="166">WINDOWS 11 PHYSICAL HOST</text><text class="small" x="82" y="191">Host running the virtual machines and Ubuntu LTS on WSL</text>
<rect class="vm" x="92" y="230" width="330" height="242" rx="16"/><rect class="pill" x="112" y="248" width="146" height="28" rx="14"/><text class="pillText" x="129" y="267">VIRTUAL MACHINE</text><text class="h" x="118" y="315">Kali Linux</text><text class="t" x="118" y="346">Attacker simulation</text><text class="small" x="118" y="376">Controlled malicious activity</text><text class="small" x="118" y="400">toward the Windows Server VM</text><path d="M127 430h220" stroke="#dbe7ef" stroke-width="1"/>
<rect class="vm" x="482" y="230" width="432" height="494" rx="16"/><rect class="pill" x="502" y="248" width="146" height="28" rx="14"/><text class="pillText" x="519" y="267">VIRTUAL MACHINE</text><text class="h" x="508" y="315">Windows Server</text><text class="t" x="508" y="343">Active Directory Domain Services</text><rect class="box" x="508" y="366" width="380" height="105" rx="10"/><text class="small" x="528" y="393">ACTIVE DIRECTORY DOMAIN</text><text class="h" x="528" y="425">entreprise.local</text><text class="small" x="528" y="451">Organizational Units (OUs)</text><rect class="svc" x="508" y="500" width="172" height="89" rx="10"/><text class="h" x="528" y="534">Domain users</text><text class="small" x="528" y="560">Within configured OUs</text><rect class="svc" x="696" y="500" width="192" height="89" rx="10"/><text class="h" x="716" y="534">Wazuh Agent</text><text class="small" x="716" y="560">Collects Windows events</text><text class="small" x="508" y="630">Relevant Security event records</text><text class="small" x="508" y="653">are collected by the agent.</text>
<rect class="wsl" x="1000" y="218" width="506" height="622" rx="18"/><text class="h" x="1028" y="260">Ubuntu LTS · WSL</text><text class="small" x="1028" y="284">Linux environment hosted on the Windows 11 machine</text><rect class="svc" x="1030" y="320" width="446" height="106" rx="12"/><text class="h" x="1054" y="357">Wazuh Manager</text><text class="t" x="1054" y="386">Receives agent events · analyzes · generates alerts</text><rect class="svc" x="1030" y="466" width="210" height="100" rx="12"/><text class="h" x="1052" y="505">Wazuh Indexer</text><text class="small" x="1052" y="531">Stores indexed alert data</text><rect class="svc" x="1260" y="466" width="216" height="100" rx="12"/><text class="h" x="1282" y="505">Wazuh Dashboard</text><text class="small" x="1282" y="531">Visualizes alerts &amp; events</text><rect class="pill" x="1030" y="620" width="446" height="72" rx="12"/><text class="h" x="1054" y="650">Detection and monitoring</text><text class="small" x="1054" y="675">Review analyzed events and generated alerts</text>
<path class="lineRed" d="M422 352 C448 352 455 352 480 352"/><text class="arrowLabel" x="427" y="337">Attack simulation</text><path class="lineBlue" d="M888 544 C953 544 953 373 1027 373"/><path class="lineBlue" d="M1245 427 L1245 463"/><text class="arrowLabel" x="1260" y="451">Alert indexing</text><path class="lineCyan" d="M1240 516 L1257 516"/><text class="arrowLabel" x="1238" y="590">Dashboard review</text><path class="lineCyan" d="M1368 566 L1368 617"/>
<rect x="93" y="785" width="825" height="78" rx="12" fill="#fff" stroke="#d8e5ee"/><line x1="124" y1="815" x2="200" y2="815" stroke="#d55d67" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowRed)"/><text class="small" x="215" y="820">Attack activity</text><line x1="397" y1="815" x2="473" y2="815" stroke="#1483b5" stroke-width="3" marker-end="url(#arrowBlue)"/><text class="small" x="488" y="820">Event / log flow</text><line x1="670" y1="815" x2="746" y2="815" stroke="#159ca7" stroke-width="3" marker-end="url(#arrowCyan)"/><text class="small" x="761" y="820">Alert visualization</text></svg>
