<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc"><title id="title">AI-powered cybersecurity log analyzer RAG pipeline</title><desc id="desc">Security logs are preprocessed, then passed with an analysis query into a retrieval-augmented generation workflow. The RAG workflow queries a FAISS vector index for relevant indexed knowledge, supplies retrieved context and log information to an LLM for analysis, maps supported findings to MITRE ATT&amp;CK, and presents results.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l9 5-9 5" fill="none" stroke="#147fac" stroke-width="2"/></marker><marker id="arr2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l9 5-9 5" fill="none" stroke="#16969f" stroke-width="2"/></marker><style>.bg{fill:#f6fafe}.box{fill:#fff;stroke:#9dbdd0;stroke-width:2}.rag{fill:#edf8fc;stroke:#4e9ab9;stroke-width:2.5}.retrieve{fill:#f0f8fa;stroke:#79afb7;stroke-width:2}.out{fill:#eff8f7;stroke:#78b5a4;stroke-width:2}.h{font:700 18px Arial;fill:#173650}.t{font:14px Arial;fill:#4e697d}.s{font:12px Arial;fill:#58758a}.title{font:700 30px Arial;fill:#132b43}.sub{font:15px Arial;fill:#526e83}.line{fill:none;stroke:#147fac;stroke-width:3;marker-end:url(#arr)}.line2{fill:none;stroke:#16969f;stroke-width:3;marker-end:url(#arr2)}.loop{fill:none;stroke:#16969f;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#arr2)}.tag{fill:#e6f3fa;stroke:#c0ddea}.tagt{font:700 11px Arial;fill:#216a8d}</style></defs><rect class="bg" width="1600" height="850"/><text class="title" x="56" y="62">AI-Powered Cybersecurity Log Analyzer</text><text class="sub" x="56" y="90">RAG separates event preparation, context retrieval, model analysis, and evidence-based output.</text>
<rect class="box" x="55" y="333" width="200" height="160" rx="16"/><text class="h" x="80" y="378">Security Logs</text><text class="t" x="80" y="409">Events and analysis query</text><text class="s" x="80" y="440">Input evidence</text>
<rect class="box" x="310" y="333" width="230" height="160" rx="16"/><text class="h" x="334" y="378">Log Preprocessing</text><text class="t" x="334" y="408">Parse · clean · normalize</text><text class="t" x="334" y="434">Prepare relevant log data</text>
<rect class="rag" x="595" y="292" width="270" height="240" rx="18"/><rect class="tag" x="618" y="311" width="76" height="26" rx="13"/><text class="tagt" x="634" y="329">RAG</text><text class="h" x="618" y="374">Retrieval-Augmented</text><text class="h" x="618" y="398">Generation Pipeline</text><text class="t" x="618" y="438">Combines prepared log data</text><text class="t" x="618" y="462">with retrieved context</text>
<rect class="retrieve" x="620" y="100" width="230" height="120" rx="16"/><text class="h" x="645" y="145">FAISS Vector Index</text><text class="t" x="645" y="175">Retrieves relevant context</text><text class="s" x="645" y="197">Indexed knowledge / documentation</text>
<rect class="box" x="925" y="333" width="220" height="160" rx="16"/><text class="h" x="950" y="378">LLM Analysis</text><text class="t" x="950" y="408">Analyzes log evidence</text><text class="t" x="950" y="434">with retrieved context</text>
<rect class="box" x="1205" y="333" width="190" height="160" rx="16"/><text class="h" x="1227" y="374">MITRE ATT&amp;CK</text><text class="t" x="1227" y="406">Map relevant findings</text><text class="s" x="1227" y="434">Only when evidence supports</text>
<rect class="out" x="1425" y="333" width="150" height="160" rx="16"/><text class="h" x="1445" y="378">Analysis</text><text class="h" x="1445" y="402">Results</text><text class="t" x="1445" y="437">Findings &amp;</text><text class="t" x="1445" y="459">explanations</text>
<path class="line" d="M255 413 H306"/><path class="line" d="M540 413 H591"/><text class="s" x="550" y="397">Prepared logs + query</text><path class="line" d="M865 413 H921"/><text class="s" x="872" y="397">Log evidence</text><path class="line2" d="M735 288 V224"/><text class="s" x="750" y="259">Retrieve context</text><path class="loop" d="M620 164 C540 164 548 300 680 292"/><text class="s" x="481" y="230">Relevant indexed context</text><path class="line" d="M1145 413 H1201"/><path class="line2" d="M1395 413 H1421"/>
<rect x="595" y="580" width="800" height="104" rx="14" fill="#fff" stroke="#d5e4ec"/><text class="h" x="622" y="617">Evidence-aware interpretation</text><text class="t" x="622" y="648">ATT&amp;CK technique mapping is conditional: report a mapping only when the available evidence supports it.</text><path class="line2" d="M1300 495 V576"/><text class="s" x="1315" y="547">Supported mapping</text></svg>
