<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc"><title id="title">Conceptual Azure medical image classification architecture</title><desc id="desc">A user submits an image through a web application. Azure Functions orchestrates storage in Azure Blob Storage, classification by Azure AI Custom Vision, and persistence in Azure Database for MySQL. Results return to the web application for display. Conceptual architecture pending implementation verification.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l9 5-9 5" fill="none" stroke="#1582b2" stroke-width="2"/></marker><marker id="arrC" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l9 5-9 5" fill="none" stroke="#159ba6" stroke-width="2"/></marker><style>.bg{fill:#f6fafe}.azure{fill:#fff;stroke:#8fb8cf;stroke-width:2}.group{fill:#eef7fc;stroke:#9cc6dc;stroke-width:2}.service{fill:#fff;stroke:#76aecb;stroke-width:2}.h{font:700 18px Arial;fill:#153650}.t{font:14px Arial;fill:#49677e}.s{font:12px Arial;fill:#5b778c}.title{font:700 30px Arial;fill:#132b43}.sub{font:15px Arial;fill:#526e83}.line{fill:none;stroke:#1582b2;stroke-width:3;marker-end:url(#arr)}.lineC{fill:none;stroke:#159ba6;stroke-width:3;marker-end:url(#arrC)}.num{fill:#e3f3fb;stroke:#aad0e1}.ntext{font:700 13px Arial;fill:#176a8d}.tag{fill:#fff3d6;stroke:#ebcf8d}.tagt{font:700 12px Arial;fill:#795d1b}</style></defs><rect class="bg" width="1500" height="820"/><text class="title" x="54" y="62">Cloud-Based AI Medical Image Classification</text><text class="sub" x="54" y="90">Conceptual architecture · verify service flow against the implemented application</text><rect class="tag" x="1174" y="38" width="272" height="38" rx="19"/><text class="tagt" x="1200" y="62">CONCEPTUAL · IMPLEMENTATION UNVERIFIED</text>
<rect class="azure" x="48" y="280" width="172" height="170" rx="16"/><circle class="num" cx="78" cy="309" r="16"/><text class="ntext" x="73" y="314">1</text><text class="h" x="72" y="354">User</text><text class="t" x="72" y="382">Uploads medical image</text><text class="t" x="72" y="405">Requests classification</text>
<rect class="azure" x="274" y="280" width="205" height="170" rx="16"/><circle class="num" cx="304" cy="309" r="16"/><text class="ntext" x="299" y="314">2</text><text class="h" x="298" y="354">Web Application</text><text class="t" x="298" y="382">Image upload interface</text><text class="t" x="298" y="405">Displays results</text>
<rect class="group" x="538" y="184" width="880" height="532" rx="22"/><text class="h" x="570" y="222">Azure services</text><circle class="num" cx="593" cy="278" r="16"/><text class="ntext" x="588" y="283">3</text><rect class="service" x="620" y="250" width="274" height="118" rx="14"/><text class="h" x="646" y="292">Azure Functions</text><text class="t" x="646" y="320">Backend processing</text><text class="t" x="646" y="343">and orchestration</text>
<circle class="num" cx="593" cy="466" r="16"/><text class="ntext" x="588" y="471">4</text><rect class="service" x="620" y="416" width="274" height="120" rx="14"/><text class="h" x="646" y="458">Azure Blob Storage</text><text class="t" x="646" y="487">Stores uploaded medical images</text>
<circle class="num" cx="993" cy="278" r="16"/><text class="ntext" x="988" y="283">5</text><rect class="service" x="1020" y="250" width="350" height="118" rx="14"/><text class="h" x="1046" y="292">Azure AI Custom Vision</text><text class="t" x="1046" y="321">Image classification service</text>
<circle class="num" cx="993" cy="466" r="16"/><text class="ntext" x="988" y="471">6</text><rect class="service" x="1020" y="416" width="350" height="120" rx="14"/><text class="h" x="1046" y="458">Azure Database for MySQL</text><text class="t" x="1046" y="487">Application data &amp; classification records</text>
<rect class="azure" x="274" y="564" width="205" height="118" rx="16"/><circle class="num" cx="304" cy="593" r="16"/><text class="ntext" x="299" y="598">7</text><text class="h" x="298" y="633">Classification Results</text><text class="t" x="298" y="658">Presented to the user</text>
<path class="line" d="M220 362 H270"/><text class="s" x="224" y="347">Image + request</text><path class="line" d="M479 362 H566 V309 H616"/><text class="s" x="487" y="344">Upload request</text><path class="line" d="M758 370 V411"/><text class="s" x="773" y="399">Store / retrieve image</text><path class="line" d="M894 309 H1016"/><text class="s" x="915" y="294">Image for classification</text><path class="line" d="M894 338 C957 338 961 477 1016 477"/><text class="s" x="902" y="414">Persist relevant records</text><path class="lineC" d="M1020 326 C970 326 954 390 894 390"/><text class="s" x="912" y="372">Classification output</text><path class="lineC" d="M620 340 C554 340 547 623 483 623"/><text class="s" x="505" y="580">Results to application</text><path class="lineC" d="M274 623 C226 623 226 415 218 415"/><text class="s" x="89" y="491">Displayed to user</text><text class="s" x="570" y="660">Logical data flow only; service-to-service details depend on the implementation.</text></svg>
